[project]
name = "gpu-calculator"
version = "0.1.0"
description = "Простой калькулятор GPU для инференса LLM"
requires-python = ">=3.10"
dependencies = ["fastapi[standard]>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_calculator"]
